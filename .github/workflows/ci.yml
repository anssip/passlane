name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace
      # passlane-core without its `usb` feature is the mobile (iOS/FFI)
      # configuration: virtual challenge-response keys in, libusb out.
      - run: cargo test --locked -p passlane-core --no-default-features
      # Cargo unifies features: another crate in a build may turn on
      # keepass-ng's USB feature without passlane-core's `usb`. Core must
      # still compile there, with virtual keys only.
      - run: cargo build --locked -p passlane-core --no-default-features --features keepass-ng/challenge_response_usb

  ios:
    # The no-USB configuration must build for iOS, where libusb does not
    # exist: the vault still opens with password, keyfile and virtual keys.
    # passlane-ffi rides along: the UniFFI surface the iOS app consumes
    # (passlane#44) must stay buildable for both device and simulator.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: cargo build --locked -p passlane-core --no-default-features --target aarch64-apple-ios
      - run: cargo build --locked -p passlane-core --no-default-features --target aarch64-apple-ios-sim
      - run: cargo build --locked -p passlane-ffi --target aarch64-apple-ios
      - run: cargo build --locked -p passlane-ffi --target aarch64-apple-ios-sim

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Informational "unmaintained" advisories only — no fix exists
          # at our end for any of them: chrono is used across the codebase
          # and inside keepass-ng (the advisory recommends an ecosystem
          # migration, RUSTSEC-2026-0543); humantime is pulled by
          # env_logger and wraps chrono (RUSTSEC-2026-0542); fxhash by
          # inquire (RUSTSEC-2025-0057); proc-macro-error2 by a transitive
          # derive (RUSTSEC-2026-0173). Vulnerabilities stay loud.
          ignore: RUSTSEC-2026-0543,RUSTSEC-2026-0542,RUSTSEC-2025-0057,RUSTSEC-2026-0173
