<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>passlane approval</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Approval request</h1>
    <p id="status" aria-live="polite"></p>
    <section id="request" hidden>
      <dl>
        <dt>What</dt><dd id="op"></dd>
        <dt>Vault</dt><dd id="vault"></dd>
        <dt>Requested by</dt><dd id="requester"></dd>
        <dt>Scope</dt><dd id="scope"></dd>
        <dt>Lifetime</dt><dd id="expires"></dd>
      </dl>
      <label for="reason">Reason (shown when denying)</label>
      <input id="reason" type="text" autocomplete="off">
      <div class="actions">
        <button id="approve">Approve</button>
        <button id="deny" class="secondary">Deny</button>
      </div>
    </section>
    <div id="response-wrap" hidden>
      <p>Paste this response into the terminal:</p>
      <textarea id="response" rows="6" readonly></textarea>
      <button id="copy">Copy</button>
    </div>
  </main>
  <script type="module" src="./js/approve.js"></script>
  <script type="module">
    document.getElementById("copy")?.addEventListener("click", async () => {
      const response = document.getElementById("response");
      await navigator.clipboard.writeText(response.value);
    });
  </script>
</body>
</html>
