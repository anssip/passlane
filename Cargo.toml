[workspace]
resolver = "2"
members = ["crates/*"]

# Interim pin until the challenge_response/challenge_response_usb feature split
# is released on crates.io (passlane#47, upstream PR ssrlive/keepass-ng#2).
[patch.crates-io]
keepass-ng = { git = "https://github.com/anssip/keepass-ng.git", branch = "challenge-response-usb" }

[package]
name = "passlane"
version = "4.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Anssi Piirainen <anssip@email.com>"]
license = "GPL-3.0-or-later"
description = "A password manager and authenticator for the command line"
readme = "README.md"
homepage = "https://github.com/anssip/passlane"
repository = "https://github.com/anssip/passlane"
keywords = [
    "keepass",
    "password-manager",
    "password-generator",
    "totp",
    "authenticator",
]
categories = ["command-line-utilities"]

[dependencies]
arboard = { version = "3.4", default-features = false }
clap = { version = "4.5.4", features = ["env"] }
clap_complete = "4.5.2"
csv = "1.3.0"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
erased-serde = "0.3"
dirs = "5.0.1"
regex = "1.5.5"
comfy-table = "7.0.1"
serde_urlencoded = "0.7.1"
log = "0.4.16"
anyhow = "1.0.56"
chrono = { version = "0.4.19", features = ["serde"] }
env_logger = "0.10.0"
hex = "0.4.3"
keepass-ng = { version = "0.11.11", features = ["save_kdbx4", "totp", "challenge_response", "challenge_response_usb"] }
# Shared vault/generator/hwkey logic (issue #42). `usb` turns on real
# hardware-key support; the path+version form lets `cargo publish` rewrite
# it to the registry dependency once passlane-core is published.
passlane-core = { path = "crates/passlane-core", version = "4.0.0", features = ["usb"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
percent-encoding = "2.3.1"
rustyline-derive = "0.10.0"
rustyline = "14.0.0"
inquire = "0.7.5"
ctrlc = "3.4"
zeroize = "1.8"
# Exclusive file locking for the append-only approval log (same version as
# passlane-approval's file-backed nonce store).
fs4 = "1.1"
# Approval-protocol message types for the agent ask flow (issue #50). The
# path+version form lets `cargo publish` rewrite it to the registry
# dependency once passlane-approval is published.
passlane-approval = { path = "crates/passlane-approval", version = "0.1.0" }

[dev-dependencies]
tempfile = "3.24.0"
