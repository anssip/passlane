[workspace]
resolver = "2"
members = ["crates/*"]

[package]
name = "passlane"
version = "4.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Anssi Piirainen <anssip@email.com>"]
license = "GPL-3.0-or-later"
description = "A password manager and authenticator for the command line"
readme = "README.md"
homepage = "https://github.com/anssip/passlane"
repository = "https://github.com/anssip/passlane"
keywords = [
    "keepass",
    "password-manager",
    "password-generator",
    "totp",
    "authenticator",
]
categories = ["command-line-utilities"]

[dependencies]
arboard = { version = "3.4", default-features = false }
clap = { version = "4.5.4", features = ["env"] }
clap_complete = "4.5.2"
csv = "1.3.0"
serde = { version = "1.0.198", features = ["derive"] }
serde_json = "1.0.116"
erased-serde = "0.3"
dirs = "5.0.1"
regex = "1.5.5"
comfy-table = "7.0.1"
serde_urlencoded = "0.7.1"
log = "0.4.16"
anyhow = "1.0.56"
chrono = { version = "0.4.19", features = ["serde"] }
env_logger = "0.10.0"
hex = "0.4.3"
keepass-ng = { version = "0.12", features = ["save_kdbx4", "totp", "challenge_response", "challenge_response_usb"] }
# Shared vault/generator/hwkey logic (issue #42). `usb` turns on real
# hardware-key support; the path+version form lets `cargo publish` rewrite
# it to the registry dependency once passlane-core is published.
passlane-core = { path = "crates/passlane-core", version = "4.0.0", features = ["usb"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
uuid = { version = "1.8.0", features = ["v4", "serde"] }
percent-encoding = "2.3.1"
rustyline-derive = "0.10.0"
rustyline = "14.0.0"
inquire = "0.7.5"
ctrlc = "3.4"
zeroize = "1.8"
# Exclusive file locking for the append-only approval log (same version as
# passlane-approval's file-backed nonce store).
fs4 = "1.1"
# Approval-protocol message types for the agent ask flow (issue #50). The
# path+version form lets `cargo publish` rewrite it to the registry
# dependency once passlane-approval is published.
passlane-approval = { path = "crates/passlane-approval", version = "0.1.0" }
# Terminal QR rendering for the approval link transport (issue #51): the
# request envelope rides the URL fragment, printed as a scannable QR.
qrcode = "0.14"
# Approval-key generation and envelope randomness (issue #51); same 0.8
# line as passlane-approval, one shared lockfile version.
rand = "0.8"
# Session-agent client for unlock/approval sessions (issue #54).
passlane-agent = { path = "crates/passlane-agent", version = "0.1.0" }
# Closing inherited fds when auto-starting the session agent (issue #77):
# a detached daemon must not hold a spawning command's pipes open.
# Already in the tree via arboard/ctrlc; same major line as keepass-ng's.
libc = "0.2"
# The registry derives the phone-held key's holder-side vault id with it
# (same version as passlane-approval's, so the workspace unifies).
sha2 = "0.10"

[dev-dependencies]
# Same versions as passlane-approval's, so the workspace unifies: the
# approval-transport tests build mocked passkeys with p256.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
tempfile = "3.24.0"
# The mocked phone of the phone-held-key tests computes HMAC-SHA1 answers
# exactly as keepass-ng's LocalChallenge (a YubiKey slot) does. Same
# versions as passlane-approval's, so the workspace unifies.
hmac = "0.12"
sha1 = "0.10"
