[package]
name = "passlane-ffi"
version = "4.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Anssi Piirainen <anssip@email.com>"]
license = "GPL-3.0-or-later"
description = "UniFFI bindings for the passlane vault API: the read-only v1 surface the iOS app consumes"
repository = "https://github.com/anssip/passlane"
keywords = ["keepass", "password-manager", "ffi", "uniffi"]
categories = ["api-bindings"]

[dependencies]
# The FFI surface is a thin image of core's entities and vault traits. No
# `usb` feature: the phone has no USB, so only virtual challenge-response
# keys exist here (same configuration as the iOS core build).
passlane-core = { path = "../passlane-core", version = "4.0.0" }
# The approval-protocol surface (passlane#82): envelopes, pairing, pins,
# replay protection, and the phone-side challenge answer — a thin image
# of the protocol crate, byte-oriented and stateless where possible.
passlane-approval = { path = "../passlane-approval", version = "0.1.0" }
uniffi = "0.32"
uuid = "1.8.0"
# Zeroizing for the secrets that cross the boundary (master password,
# challenge secret, every fetched field) — same version as passlane-core.
zeroize = "1.8"
# OsRng for identity-key generation and envelope sealing randomness —
# same 0.8 line as passlane-approval's.
rand = "0.8"

[dev-dependencies]
tempfile = "3.24.0"
# The approval-surface tests play the CLI side of each round-trip with the
# protocol crate directly (proving the FFI opens exactly what the CLI
# seals) and build a mocked WebAuthn assertion the same way
# passlane-approval's own tests do — same versions, so the workspace
# unifies.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
sha2 = "0.10"

[lib]
name = "passlane_ffi"
# `staticlib` is what the iOS XCFramework (#45) packs; `cdylib` is what
# `uniffi-bindgen --library` reads the component metadata from; `lib` keeps
# the Rust tests able to link the crate.
crate-type = ["lib", "cdylib", "staticlib"]
